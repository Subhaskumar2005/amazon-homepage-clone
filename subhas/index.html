<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h2>amazon</h2>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search Amazon">
            <button>Search</button>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Today's Deals</a>
            <a href="#">Orders</a>
            <a href="#">Cart 🛒</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Amazon</h1>
        <p>Discover millions of products at great prices.</p>
    </section>

    <!-- Products -->
    <section class="products">

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Wireless Headphones</h3>
            <p>₹1,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Smart Watch</h3>
            <p>₹2,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Laptop</h3>
            <p>₹49,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Mobile Phone</h3>
            <p>₹19,999</p>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Amazon Clone | Created with HTML & CSS</p>
    </footer>

</body>

</html>
